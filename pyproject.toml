[build-system]
# packaging>=24.2 is required explicitly: setuptools>=77 needs it to validate
# the SPDX `license`/`license-files` fields below (packaging.licenses), but
# some build-isolation environments (observed on macOS/Windows cibuildwheel
# runners) don't otherwise pick up a recent enough copy on their own.
requires = [
    "setuptools>=77",
    "setuptools-scm>=7",
    "cython>=3.0",
    "numpy>=1.24",
    "packaging>=24.2",
]
build-backend = "setuptools.build_meta"

[project]
name = "musyn"
dynamic = ["version"]
description = "Muscle synergy analysis from surface EMG: adaptive envelope extraction, NMF decomposition, AIC-based synergy number selection"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Simone Ranaldi", email = "sm.ranaldi@gmail.com" }
]
keywords = ["EMG", "electromyography", "muscle synergy", "NMF", "envelope", "biomechanics", "motor control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "joblib>=1.3",
]

[project.optional-dependencies]
# PyWavelets is only needed for the AIC-curve-based selection methods
# ('min', 'der', 'firstpeak', 'lastpeak') -- see wavelet_dof.py / CLAUDE.md.
wavelet = ["PyWavelets>=1.4"]
jit = ["numba>=0.57"]
plot = ["matplotlib>=3.7"]
ecg = ["scikit-learn>=1.3"]
docs = [
    "sphinx>=7.2",
    "myst-parser>=2.0",
    "furo>=2024.1.29",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "hypothesis>=6.100",
    "cython>=3.0",
]
all = ["musyn[wavelet,jit,plot,ecg,dev]"]

[project.urls]
Homepage = "https://github.com/SmRanaldi/musyn"
Repository = "https://github.com/SmRanaldi/musyn"
Documentation = "https://musyn.readthedocs.io"
"Bug Tracker" = "https://github.com/SmRanaldi/musyn/issues"
Changelog = "https://github.com/SmRanaldi/musyn/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
musyn = ["py.typed"]

[tool.setuptools_scm]
write_to = "src/musyn/_version.py"
fallback_version = "0.1.0"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "numba: marks tests requiring numba",
    "wavelet: marks tests requiring pywt",
    "cython: marks tests requiring the compiled C extension",
]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.cibuildwheel]
# Build the Cython envelope extension for CPython 3.10-3.13 on the three
# major platforms; the package still installs (falling back to the Numba
# or NumPy envelope backend) on any interpreter/platform combo skipped here.
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux* pp*"
test-extras = ["dev"]
test-command = "pytest {project}/tests -m 'not slow'"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
# manylinux2014 (the cibuildwheel default) is too old: scipy no longer
# publishes wheels for it for every supported CPython version, which made
# `pip install musyn[dev]` fall back to building scipy from source during
# the test step -- and that container has no OpenBLAS, so it failed.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
