name: Build and publish

# Builds wheels (with the compiled Cython envelope backend) for Linux/macOS/
# Windows plus a source distribution, and publishes them to PyPI whenever a
# GitHub Release is published. Uses PyPI "trusted publishing" (OIDC) --
# no API token/secret needed, but the project must be registered as a
# trusted publisher for this repo + workflow at
# https://pypi.org/manage/account/publishing/ before the first release.
#
# A manual "Run workflow" dispatch builds and checks the artifacts (via
# `twine check`) without publishing, for testing the build itself.

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build-wheels:
    name: Wheels — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs full history for version tags

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS_LINUX: "x86_64 aarch64"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build
      - run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  check:
    name: Check distributions
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-raw
          pattern: "wheels-*"

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist-raw/sdist

      - run: |
          mkdir -p dist
          find dist-raw -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

