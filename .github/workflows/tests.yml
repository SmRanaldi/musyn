name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Builds the Cython envelope backend when a compiler is available
      # (always true on these GitHub-hosted runners); the package still
      # installs and tests pass on platforms without one, via the Numba/
      # NumPy fallback (see src/musyn/envelope/adaptive.py).
      - name: Install musyn with all extras
        run: pip install -e ".[all]"

      - name: Generate synthetic sample data
        run: python examples/generate_sample_data.py

      - name: Run tests
        run: pytest tests/ -m "not slow" --cov=musyn --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-no-optional-deps:
    # Confirms the package installs and the core API (envelope, NMF, VAF/R2
    # selection methods) works with only the hard dependencies -- no numba,
    # PyWavelets, scikit-learn, or matplotlib.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python examples/generate_sample_data.py
      - run: pytest tests/ -m "not slow and not numba and not wavelet"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs,wavelet,plot]"
      - run: sphinx-build -b html -W --keep-going docs docs/_build/html
